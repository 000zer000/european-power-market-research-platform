name: quality

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/cache
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=power_market --cov-report=term-missing --cov-fail-under=85

  research-artifact-contract:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/cache
      LOKY_MAX_CPU_COUNT: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Verify committed research evidence
        run: python tools/validate_research_artifacts.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path data/raw
            --exclude-path data/interim
            --exclude '^https://api\.energy-charts\.info/?$'
            --exclude '^https://www\.epexspot\.com/en/new-15-minute-products-market-coupling$'
            --accept 200,429
            '**/*.md'
