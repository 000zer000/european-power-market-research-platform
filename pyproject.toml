[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "european-power-market-research-platform"
version = "1.0.0"
description = "Leakage-safe DE-LU day-ahead price forecasting and battery value research"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Othmane Hassani"}]
dependencies = [
  "matplotlib==3.10.3",
  "numpy==2.3.0",
  "pandas==2.3.3",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.0",
  "scipy==1.15.3",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pandas-stubs==2.3.0.250703",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "types-PyYAML==6.0.12.20250516",
]

[project.scripts]
power-market = "power_market.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/power_market"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["power_market"]
omit = ["src/power_market/cli.py", "src/power_market/reporting.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
